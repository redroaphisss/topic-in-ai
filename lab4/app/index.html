<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RAG Study Helper</title><style>body{font:18px system-ui;max-width:760px;margin:8vh auto;padding:24px;background:#f5f7fc;color:#17243b}input,textarea,button{font:inherit;padding:12px}input,textarea{box-sizing:border-box;width:100%}textarea{height:90px}button{background:#244bd7;color:white;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap}article{background:white;padding:20px;border-radius:12px;margin-top:20px}</style><h1>RAG Study Helper</h1><p>Ask about RAG, Docker, Terraform, or this deployment. Answers cite the bundled study notes.</p><form id="form"><p><label for="apiKey">OpenAI API key</label><input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" aria-describedby="keyHelp"></p><p id="keyHelp">Used for your requests through this server. Not saved; leave blank to use the server’s configured key.</p><textarea id="question" maxlength="2000" required placeholder="How does RAG use embeddings?"></textarea><p><button id="send">Ask question</button></p></form><article id="answer" aria-live="polite">Your answer will appear here.</article><section id="sources"></section><script>form.onsubmit=async e=>{e.preventDefault();send.disabled=true;answer.textContent='Searching notes and asking the model…';sources.replaceChildren();try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:question.value,api_key:document.getElementById('apiKey').value.trim() || undefined})});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Please check your question');answer.textContent=d.answer;for(const s of d.sources){const a=document.createElement('article');a.textContent=`[${s.id}] ${s.title}: ${s.text}`;sources.append(a)}}catch(e){answer.textContent=e.message}finally{send.disabled=false}}</script>
